  <script>
    (function() {
      const API_URL = window.location.origin;

      var bgVideo = document.getElementById('bgVideo');
      document.addEventListener('click', function() {
        if (bgVideo.muted) {
          bgVideo.muted = false;
          bgVideo.play();
        }
      });

      let particlesStarted = false;
      function startParticles() {
        if (particlesStarted) return;
        particlesStarted = true;
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        const particles = [];
        const COUNT = 50;
        const DIST = 120;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle { constructor() { this.reset(); } reset() { this.x = Math.random() * w; this.y = Math.random() * h; this.vx = (Math.random() - 0.5) * 0.6; this.vy = (Math.random() - 0.5) * 0.6; this.r = Math.random() * 1.6 + 0.5; } update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > w) this.vx *= -1; if (this.y < 0 || this.y > h) this.vy *= -1; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill(); } }
        for (let i = 0; i < COUNT; i++) particles.push(new Particle());
        function animate() {
          ctx.clearRect(0, 0, w, h);
          for (let p of particles) { p.update(); p.draw(); }
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < DIST) {
                const opacity = 0.3 * (1 - dist / DIST);
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(animate);
        }
        canvas.classList.add('show');
        animate();
      }

      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        return audioCtx;
      }
      function playBeep(freq = 800, duration = 150, type = 'sine', vol = 0.25) {
        const ctx = getAudioCtx();
        if (!ctx) return;
        try { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.value = freq; gain.gain.value = vol; gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration / 1000); } catch (e) {}
      }
      function playClick() { playBeep(1200, 80, 'square', 0.15); }
      function playSuccess() { playBeep(880, 120, 'sine', 0.25); setTimeout(() => playBeep(1100, 120, 'sine', 0.2), 150); }
      function playWelcome() { playBeep(600, 200, 'sine', 0.2); setTimeout(() => playBeep(800, 200, 'sine', 0.2), 220); setTimeout(() => playBeep(1000, 250, 'sine', 0.25), 440); }
      function playSwitch() { playBeep(500, 100, 'triangle', 0.2); setTimeout(() => playBeep(700, 100, 'triangle', 0.2), 120); }
      document.addEventListener('click', function firstClick() { getAudioCtx(); document.removeEventListener('click', firstClick); }, { once: true });

      let typingInterval = null;
      function typeText(element, text, speed = 55) {
        const headingText = document.getElementById('headingText');
        if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
        headingText.textContent = '';
        let index = 0;
        typingInterval = setInterval(() => {
          if (index < text.length) { headingText.textContent += text.charAt(index); index++; }
          else { clearInterval(typingInterval); typingInterval = null; }
        }, speed);
      }

      function pixelReassemble(cardEl) {
        const cv = document.getElementById('pixelCv');
        const card = document.getElementById('card');
        const rect = card.getBoundingClientRect();
        cv.style.display = 'block';
        cv.width = rect.width;
        cv.height = rect.height;
        const ctx = cv.getContext('2d');
        const COLS = 20, ROWS = 14;
        const pw = cv.width / COLS, ph = cv.height / ROWS;
        const grid = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const side = Math.floor(Math.random() * 4);
            let sx, sy;
            if (side === 0) { sx = Math.random() * cv.width; sy = -80; } else if (side === 1) { sx = cv.width + 80; sy = Math.random() * cv.height; } else if (side === 2) { sx = Math.random() * cv.width; sy = cv.height + 80; } else { sx = -80; sy = Math.random() * cv.height; }
            const b = 0.04 + Math.random() * 0.12;
            grid.push({ tx: c * pw, ty: r * ph, x: sx, y: sy, delay: Math.random() * 400, spd: 0.06 + Math.random() * 0.08, alpha: 0, b: b });
          }
        }
        cardEl.style.opacity = '0';
        let startTime = null;
        const DURATION = 1200;
        function frame(time) {
          if (!startTime) startTime = time;
          const elapsed = time - startTime;
          ctx.clearRect(0, 0, cv.width, cv.height);
          let done = true;
          grid.forEach(p => {
            const t = Math.max(0, elapsed - p.delay);
            const prog = Math.min(t / (DURATION * 0.7), 1);
            if (prog < 1) done = false;
            p.x += (p.tx - p.x) * p.spd;
            p.y += (p.ty - p.y) * p.spd;
            p.alpha = Math.min(1, prog * 2);
            const c = Math.floor(p.b * 255);
            ctx.fillStyle = `rgba(${c},${c},${c},${p.alpha})`;
            ctx.fillRect(p.x, p.y, pw + 0.5, ph + 0.5);
          });
          if (!done) { requestAnimationFrame(frame); }
          else {
            cardEl.style.transition = 'opacity 0.4s';
            cardEl.style.opacity = '1';
            let fade = 1;
            function fadeOut() {
              fade -= 0.04;
              if (fade > 0) {
                ctx.clearRect(0, 0, cv.width, cv.height);
                grid.forEach(p => {
                  const c = Math.floor(p.b * 255);
                  ctx.fillStyle = `rgba(${c},${c},${c},${fade})`;
                  ctx.fillRect(p.tx, p.ty, pw + 0.5, ph + 0.5);
                });
                requestAnimationFrame(fadeOut);
              } else { cv.style.display = 'none'; }
            }
            fadeOut();
          }
        }
        requestAnimationFrame(frame);
      }

      function pixelScatter(callback) {
        const cv = document.getElementById('pixelCv');
        const card = document.getElementById('card');
        const rect = card.getBoundingClientRect();
        cv.style.display = 'block';
        cv.width = rect.width;
        cv.height = rect.height;
        const ctx = cv.getContext('2d');
        const COLS = 16, ROWS = 12;
        const pw = cv.width / COLS, ph = cv.height / ROWS;
        const pixels = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            pixels.push({ x: c * pw, y: r * ph, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 1, decay: 0.01 + Math.random() * 0.015, size: pw * 0.7 });
          }
        }
        function scatterLoop() {
          ctx.clearRect(0, 0, cv.width, cv.height);
          let alive = false;
          pixels.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
            if (p.life > 0) { alive = true; ctx.globalAlpha = p.life; ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1; }
          });
          if (alive) { requestAnimationFrame(scatterLoop); }
          else { cv.style.display = 'none'; if (callback) callback(); }
        }
        scatterLoop();
      }

      let isSignup = false;
      let isAnimating = false;

      function toggleMode() {
        if (isAnimating) return;
        isAnimating = true;
        const outer = document.getElementById('cardOuter');
        const card = document.getElementById('card');
        playSwitch();
        pixelScatter(function() {
          isSignup = !isSignup;
          const sub = document.getElementById('modeSub');
          const heading = document.getElementById('modeHeading');
          const btnP = document.getElementById('btnP');
          const btnS = document.getElementById('btnS');
          const uField = document.getElementById('uField');
          const cField = document.getElementById('cField');
          if (isSignup) {
            sub.textContent = 'Join us';
            btnP.textContent = 'CREATE ACCOUNT';
            btnS.textContent = 'SIGN IN INSTEAD';
            uField.classList.remove('hidden-field');
            cField.classList.remove('hidden-field');
            heading.textContent = 'Create Account';
          } else {
            sub.textContent = 'Welcome back';
            btnP.textContent = 'SIGN IN';
            btnS.textContent = 'CREATE ACCOUNT';
            uField.classList.add('hidden-field');
            cField.classList.add('hidden-field');
            heading.textContent = 'Sign In';
          }
          document.getElementById('uInput').value = '';
          document.getElementById('emailInput').value = '';
          document.getElementById('passInput').value = '';
          document.getElementById('cInput').value = '';
          outer.classList.remove('drop');
          outer.style.opacity = '0';
          outer.style.transform = 'translateY(-40px)';
          setTimeout(function() {
            outer.style.opacity = '1';
            outer.style.transform = 'translateY(0)';
            pixelReassemble(card);
            setTimeout(() => {
              const fullText = heading.textContent.replace(/[^a-zA-Z ]/g, '').trim();
              if (fullText) { document.getElementById('headingText').textContent = ''; typeText(heading, fullText, 50); }
              isAnimating = false;
              playSuccess();
            }, 200);
          }, 100);
        });
      }

      function showToast(message, type = 'error') {
        const toast = document.getElementById('toastMsg');
        toast.textContent = message;
        toast.className = 'toast-msg ' + type;
        void toast.offsetWidth;
        toast.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      function isArabicChar(ch) { return /[\u0600-\u06FF]/.test(ch); }
      function blockArabic(input) {
        input.addEventListener('input', function() {
          let val = this.value, filtered = '', hasArabic = false;
          for (let ch of val) { if (isArabicChar(ch)) hasArabic = true; else filtered += ch; }
          if (hasArabic) { this.value = filtered; showToast('Sorry, Arabic username is not supported yet', 'error'); }
        });
        input.addEventListener('keydown', function(e) {
          if (e.key.length === 1 && isArabicChar(e.key)) { e.preventDefault(); showToast('Sorry, Arabic username is not supported yet', 'error'); }
        });
        input.addEventListener('paste', function(e) {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text') || '';
          let filtered = '', hasArabic = false;
          for (let ch of text) { if (isArabicChar(ch)) hasArabic = true; else filtered += ch; }
          if (hasArabic) showToast('Sorry, Arabic username is not supported yet', 'error');
          if (filtered.length > 0) { this.value += filtered; this.dispatchEvent(new Event('input', { bubbles: true })); }
        });
      }

      const emailInput = document.getElementById('emailInput');
      const passInput = document.getElementById('passInput');
      const uInput = document.getElementById('uInput');
      const cInput = document.getElementById('cInput');
      blockArabic(emailInput); blockArabic(passInput); blockArabic(uInput); blockArabic(cInput);

      let showPass = false;
      function togglePass() {
        showPass = !showPass;
        passInput.type = showPass ? 'text' : 'password';
        cInput.type = showPass ? 'text' : 'password';
        document.getElementById('iShow').style.display = showPass ? 'none' : 'block';
        document.getElementById('iHide').style.display = showPass ? 'block' : 'none';
      }
      document.getElementById('eyeBtn').addEventListener('click', togglePass);
      document.getElementById('eyeBtn2').addEventListener('click', togglePass);

      function getVal(input) { return input.value; }

      async function apiCall(endpoint, data) {
        const res = await fetch(API_URL + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await res.json();
      }

      function showAuthForms() {
        document.getElementById('authForms').classList.remove('hidden');
        document.getElementById('welcomeBox').classList.add('hidden');
        document.getElementById('modeSub').textContent = isSignup ? 'Join us' : 'Welcome back';
        document.getElementById('modeHeading').textContent = isSignup ? 'Create Account' : 'Sign In';
        document.getElementById('btnP').textContent = isSignup ? 'CREATE ACCOUNT' : 'SIGN IN';
        document.getElementById('btnS').textContent = isSignup ? 'SIGN IN INSTEAD' : 'CREATE ACCOUNT';
        document.getElementById('uField').classList.toggle('hidden-field', !isSignup);
        document.getElementById('cField').classList.toggle('hidden-field', !isSignup);
        const heading = document.getElementById('modeHeading');
        const fullText = heading.textContent.replace(/[^a-zA-Z ]/g, '').trim();
        if (fullText) { document.getElementById('headingText').textContent = ''; typeText(heading, fullText, 50); }
      }

      function showWelcome(user) {
        document.getElementById('authForms').classList.add('hidden');
        document.getElementById('welcomeBox').classList.remove('hidden');
        document.getElementById('welcomeUser').textContent = user.username || user.email;
      }

      async function handleLoginOrSignup() {
        playClick();
        const email = getVal(emailInput);
        const pass = getVal(passInput);
        if (!email || !pass) { showToast('Please fill in all fields', 'error'); return; }
        if (isSignup) {
          const user = getVal(uInput);
          const confirm = getVal(cInput);
          if (!user || user.length < 3) { showToast('Username must be at least 3 characters', 'error'); return; }
          if (pass !== confirm) { showToast('Passwords do not match', 'error'); return; }
          const data = await apiCall('/api/signup', { username: user, email, password: pass });
          if (data.error) { showToast(data.error, 'error'); return; }
          localStorage.setItem('token', data.token);
          showWelcome(data.user);
          playSuccess();
          showToast('Account created successfully', 'success');
        } else {
          const data = await apiCall('/api/login', { email, password: pass });
          if (data.error) { showToast(data.error, 'error'); return; }
          localStorage.setItem('token', data.token);
          showWelcome(data.user);
          playSuccess();
          showToast('Welcome back', 'success');
        }
      }

      document.getElementById('btnP').addEventListener('click', handleLoginOrSignup);
      document.getElementById('btnS').addEventListener('click', toggleMode);

      document.getElementById('forgotLink').addEventListener('click', function(e) {
        e.preventDefault(); playClick(); showToast('Password reset link sent to your email', 'info');
      });

      document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('token');
        showAuthForms();
        playClick();
        showToast('Logged out', 'info');
      });

      async function autoLogin() {
        const token = localStorage.getItem('token');
        if (!token) return false;
        const data = await apiCall('/api/verify', { token });
        if (data.error) { localStorage.removeItem('token'); return false; }
        showWelcome(data.user);
        return true;
      }

      window.addEventListener('load', function() {
        setTimeout(() => {
          document.getElementById('page').classList.add('show');
          setTimeout(() => {
            const outer = document.getElementById('cardOuter');
            outer.classList.add('drop');
            outer.addEventListener('animationend', function() {
              pixelReassemble(document.getElementById('card'));
              startParticles();
              setTimeout(async () => {
                playWelcome();
                const logged = await autoLogin();
                if (!logged) {
                  showAuthForms();
                }
              }, 150);
            }, { once: true });
          }, 600);
        }, 1200);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') document.activeElement?.blur();
        if (e.key === 'Enter') {
          const active = document.activeElement;
          if (active && (active.id === 'emailInput' || active.id === 'passInput' || active.id === 'uInput' || active.id === 'cInput')) {
            handleLoginOrSignup();
          }
        }
      });
    })();
  </script>
